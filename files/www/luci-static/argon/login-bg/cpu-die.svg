<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <!-- ============ خلفيات وتدرّجات ============ -->
    <linearGradient id="cd-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1330"/>
      <stop offset="55%" stop-color="#101a3c"/>
      <stop offset="100%" stop-color="#14203f"/>
    </linearGradient>
    <radialGradient id="cd-pool" cx="66%" cy="46%" r="60%">
      <stop offset="0" stop-color="#274099" stop-opacity=".55"/>
      <stop offset="45%" stop-color="#1a2a63" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#0b1330" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cd-vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="62%" stop-color="#050a1c" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#03060f" stop-opacity=".82"/>
    </radialGradient>
    <linearGradient id="cd-leftshade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05091b" stop-opacity=".92"/>
      <stop offset="26%" stop-color="#070d22" stop-opacity=".55"/>
      <stop offset="46%" stop-color="#0b1330" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cd-diefill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2b5a"/>
      <stop offset="100%" stop-color="#0e1738"/>
    </linearGradient>
    <linearGradient id="cd-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a7a2e"/>
      <stop offset="42%" stop-color="#e7c667"/>
      <stop offset="58%" stop-color="#fff2c4"/>
      <stop offset="100%" stop-color="#b8912f"/>
    </linearGradient>
    <linearGradient id="cd-goldsheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7c667" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fff6d8" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#fff6d8" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#e7c667" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cd-corehot" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#eafff0"/>
      <stop offset="30%" stop-color="#7ff0b0"/>
      <stop offset="66%" stop-color="#2f9d6a"/>
      <stop offset="100%" stop-color="#123a2c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cd-coregold" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="34%" stop-color="#f0d072"/>
      <stop offset="70%" stop-color="#a37c2a"/>
      <stop offset="100%" stop-color="#3a2c0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cd-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa2f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#cfd9ff" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#8fa2f7" stop-opacity="0"/>
    </linearGradient>

    <!-- ============ أنماط النسيج ============ -->
    <pattern id="cd-substrate" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#0d1730"/>
      <path d="M26 0H0v26" fill="none" stroke="#2a3d84" stroke-width="1"/>
      <circle cx="13" cy="13" r="1" fill="#3a54c9" opacity=".5"/>
    </pattern>
    <pattern id="cd-nano" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0v10" fill="none" stroke="#3a54c9" stroke-width=".6" opacity=".55"/>
    </pattern>
    <pattern id="cd-cache" width="9" height="14" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="6" height="12" rx="1" fill="#26397f" stroke="#4a63c4" stroke-width=".5"/>
    </pattern>

    <!-- ============ مرشّحات ============ -->
    <filter id="cd-blurfar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="cd-bloom" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cd-softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cd-bokeh" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- ============ عناصر قابلة لإعادة الاستخدام ============ -->
    <g id="cd-core">
      <rect x="-34" y="-34" width="68" height="68" rx="6" fill="#16244f" stroke="#4a63c4" stroke-width="1.3"/>
      <rect x="-34" y="-34" width="68" height="34" rx="6" fill="url(#cd-nano)" opacity=".8"/>
      <rect x="-30" y="0" width="60" height="30" rx="2" fill="url(#cd-cache)"/>
      <rect x="-24" y="-28" width="20" height="20" rx="2" fill="#1d2f66" stroke="#6f86e0" stroke-width=".8"/>
      <rect x="4" y="-28" width="20" height="20" rx="2" fill="#1d2f66" stroke="#6f86e0" stroke-width=".8"/>
      <rect x="-34" y="-34" width="68" height="68" rx="6" fill="none" stroke="#e7c667" stroke-width=".7" opacity=".45"/>
    </g>

    <g id="cd-cachebank">
      <rect x="0" y="0" width="70" height="150" rx="4" fill="#132145" stroke="#3a54c9" stroke-width="1"/>
      <rect x="6" y="8" width="58" height="134" fill="url(#cd-cache)" opacity=".9"/>
      <rect x="0" y="0" width="70" height="150" rx="4" fill="none" stroke="#8fa2f7" stroke-width=".6" opacity=".4"/>
    </g>

    <style>
      @keyframes cdCorePulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes cdCoreScale{0%,100%{transform:scale(.94)}50%{transform:scale(1.06)}}
      @keyframes cdFlow{to{stroke-dashoffset:-400}}
      @keyframes cdSheen{0%{transform:translateX(-520px)}100%{transform:translateX(760px)}}
      @keyframes cdScan{0%{transform:translateX(360px)}100%{transform:translateX(1360px)}}
      @keyframes cdFloat{0%{transform:translate(0,0)}50%{transform:translate(-26px,-34px)}100%{transform:translate(0,0)}}
      @keyframes cdTwinkle{0%,100%{opacity:0}50%{opacity:1}}

      .cd-corehot{transform-box:fill-box;transform-origin:center;animation:cdCorePulse 3.2s ease-in-out infinite, cdCoreScale 3.2s ease-in-out infinite}
      .cd-flow{stroke-dasharray:14 22;animation:cdFlow 3.4s linear infinite}
      .cd-flow-slow{stroke-dasharray:10 30;animation:cdFlow 6s linear infinite}
      .cd-sheen{animation:cdSheen 5.5s ease-in-out infinite}
      .cd-scanline{animation:cdScan 9s linear infinite}
      .cd-bokeh{animation:cdFloat 14s ease-in-out infinite}
      .cd-spark{animation:cdTwinkle 2.4s ease-in-out infinite}

      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <!-- ============ الخلفية ============ -->
  <rect width="1440" height="900" fill="url(#cd-sky)"/>
  <rect width="1440" height="900" fill="url(#cd-pool)"/>

  <!-- (1) طبقة الأساس البعيدة: نسيج ركيزة مموّه -->
  <g filter="url(#cd-blurfar)" opacity=".55">
    <rect x="360" y="60" width="1080" height="820" fill="url(#cd-substrate)"/>
    <g stroke="#3a54c9" stroke-width="2" opacity=".4" fill="none">
      <path d="M420 120 H1380 M420 300 H1380 M420 500 H1380 M420 700 H1380"/>
      <path d="M560 90 V860 M840 90 V860 M1120 90 V860 M1300 90 V860"/>
    </g>
  </g>

  <!-- (2) الطبقة الرئيسية الحادّة: نواة المعالج -->
  <g transform="translate(940 452)">
    <!-- جسم النواة -->
    <rect x="-330" y="-330" width="660" height="660" rx="26" fill="url(#cd-diefill)" stroke="#3a54c9" stroke-width="2"/>
    <rect x="-330" y="-330" width="660" height="660" rx="26" fill="url(#cd-nano)" opacity=".5"/>
    <rect x="-330" y="-330" width="660" height="660" rx="26" fill="none" stroke="#e7c667" stroke-width="1.4" opacity=".55"/>
    <rect x="-306" y="-306" width="612" height="612" rx="18" fill="none" stroke="#5f76d6" stroke-width="1" opacity=".5"/>

    <!-- بنوك الكاش على الأطراف -->
    <use href="#cd-cachebank" x="-306" y="-232"/>
    <use href="#cd-cachebank" x="-306" y="72"/>
    <use href="#cd-cachebank" x="236" y="-232"/>
    <use href="#cd-cachebank" x="236" y="72"/>
    <rect x="-150" y="-306" width="300" height="60" rx="3" fill="url(#cd-cache)" opacity=".85"/>
    <rect x="-150" y="246" width="300" height="60" rx="3" fill="url(#cd-cache)" opacity=".85"/>

    <!-- حلقة الربط (ring interconnect) -->
    <rect x="-214" y="-214" width="428" height="428" rx="20" fill="none" stroke="#3a54c9" stroke-width="10" opacity=".35"/>
    <rect class="cd-flow" x="-214" y="-214" width="428" height="428" rx="20" fill="none" stroke="#8fa2f7" stroke-width="3"/>
    <rect class="cd-flow-slow" x="-232" y="-232" width="464" height="464" rx="24" fill="none" stroke="#e7c667" stroke-width="1.6" opacity=".8"/>

    <!-- الممرات الذهبية الحاملة -->
    <g fill="none" stroke="url(#cd-gold)" stroke-width="4" opacity=".9">
      <path d="M-214 -120 H-330"/><path d="M-214 120 H-330"/>
      <path d="M214 -120 H330"/><path d="M214 120 H330"/>
      <path d="M-120 -214 V-330"/><path d="M120 -214 V-330"/>
      <path d="M-120 214 V330"/><path d="M120 214 V330"/>
    </g>
    <g fill="none" stroke="#e7c667" stroke-width="1.5" class="cd-flow" opacity=".95">
      <path d="M-214 -120 H-330"/><path d="M214 120 H330"/>
      <path d="M-120 214 V330"/><path d="M120 -214 V-330"/>
    </g>

    <!-- مسارات نانوية دقيقة كثيفة -->
    <g stroke="#5f76d6" stroke-width=".7" opacity=".5" fill="none">
      <path d="M-190 -160 H190 M-190 -80 H190 M-190 80 H190 M-190 160 H190"/>
      <path d="M-160 -190 V190 M-80 -190 V190 M80 -190 V190 M160 -190 V190"/>
    </g>

    <!-- مصفوفة الأنوية 3×3 -->
    <g filter="url(#cd-softglow)">
      <use href="#cd-core" x="-140" y="-140"/>
      <use href="#cd-core" x="0"    y="-140"/>
      <use href="#cd-core" x="140"  y="-140"/>
      <use href="#cd-core" x="-140" y="0"/>
      <use href="#cd-core" x="0"    y="0"/>
      <use href="#cd-core" x="140"  y="0"/>
      <use href="#cd-core" x="-140" y="140"/>
      <use href="#cd-core" x="0"    y="140"/>
      <use href="#cd-core" x="140"  y="140"/>
    </g>

    <!-- أنوية ساخنة متوهّجة مع bloom ونبض -->
    <g filter="url(#cd-bloom)">
      <circle class="cd-corehot" cx="0"   cy="0"   r="30" fill="url(#cd-corehot)"/>
      <circle class="cd-corehot" cx="140" cy="-140" r="26" fill="url(#cd-coregold)" style="animation-delay:.7s"/>
      <circle class="cd-corehot" cx="-140" cy="140" r="26" fill="url(#cd-corehot)" style="animation-delay:1.4s"/>
      <circle class="cd-corehot" cx="140" cy="140" r="22" fill="url(#cd-coregold)" style="animation-delay:2.1s"/>
      <circle class="cd-corehot" cx="-140" cy="-140" r="20" fill="url(#cd-corehot)" style="animation-delay:1s"/>
    </g>

    <!-- شرارات بيضاء -->
    <g fill="#ffffff">
      <circle class="cd-spark" cx="66" cy="-66" r="2.2"/>
      <circle class="cd-spark" cx="-70" cy="10" r="1.8" style="animation-delay:.9s"/>
      <circle class="cd-spark" cx="196" cy="70" r="2" style="animation-delay:1.6s"/>
      <circle class="cd-spark" cx="-40" cy="200" r="1.6" style="animation-delay:2.2s"/>
      <circle class="cd-spark" cx="120" cy="-210" r="1.8" style="animation-delay:1.2s"/>
    </g>

    <!-- لمعان معدني منزلق على الممرات الذهبية -->
    <clipPath id="cd-diebounds"><rect x="-330" y="-330" width="660" height="660" rx="26"/></clipPath>
    <g clip-path="url(#cd-diebounds)">
      <rect class="cd-sheen" x="-330" y="-330" width="150" height="660" fill="url(#cd-goldsheen)" opacity=".28"/>
    </g>
  </g>

  <!-- خطّ reticle / مسح رفيع يعبر النواة -->
  <rect class="cd-scanline" x="-4" y="120" width="8" height="664" fill="url(#cd-scan)" transform="translate(0 0)"/>

  <!-- (3) المقدّمة: جزيئات bokeh مموّهة تطفو (عمق ميداني) -->
  <g filter="url(#cd-bokeh)">
    <g class="cd-bokeh">
      <circle cx="1180" cy="180" r="30" fill="#8fa2f7" opacity=".16"/>
      <circle cx="720" cy="740" r="42" fill="#e7c667" opacity=".12"/>
    </g>
    <g class="cd-bokeh" style="animation-delay:4s">
      <circle cx="1320" cy="620" r="36" fill="#7ff0b0" opacity=".12"/>
      <circle cx="560" cy="240" r="24" fill="#8fa2f7" opacity=".14"/>
    </g>
    <g class="cd-bokeh" style="animation-delay:8s">
      <circle cx="980" cy="820" r="26" fill="#e7c667" opacity=".1"/>
      <circle cx="1240" cy="400" r="20" fill="#ffffff" opacity=".08"/>
    </g>
  </g>

  <!-- ============ الإضاءة والأجواء ============ -->
  <rect width="1440" height="900" fill="url(#cd-leftshade)"/>
  <rect width="1440" height="900" fill="url(#cd-vignette)"/>
</svg>
