<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="cl-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2a5e"/><stop offset="55%" stop-color="#141f48"/><stop offset="100%" stop-color="#0c1430"/></linearGradient>
    <style>
      .cl-t{fill:none;stroke:#4b63c4;stroke-width:2;opacity:.5}
      .cl-p{fill:#8fa2f7}
      .cl-g{fill:#e7c667}
      .cl-chip{fill:#22326f;stroke:#e7c667;stroke-width:1.6}
      .cl-pin{stroke:#e7c667;stroke-width:2;opacity:.8}
      @keyframes clDash{to{stroke-dashoffset:-40}}
      .cl-flow{stroke:#e7c667;stroke-width:2.4;fill:none;stroke-dasharray:6 34;opacity:.9;animation:clDash 2.2s linear infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#cl-bg)"/>
  <g>
    <path class="cl-t" d="M120 240 H480 V420 H820"/>
    <path class="cl-t" d="M1320 200 H1000 V380 H760"/>
    <path class="cl-t" d="M200 700 H560 V520 H900 V640 H1200"/>
    <path class="cl-t" d="M1300 720 H1040 V560"/>
    <path class="cl-flow" d="M120 240 H480 V420 H820"/>
    <path class="cl-flow" d="M200 700 H560 V520 H900 V640 H1200"/>
  </g>
  <g class="cl-chip-g">
    <rect class="cl-chip" x="820" y="380" width="90" height="90" rx="10"/>
    <line class="cl-pin" x1="820" y1="400" x2="805" y2="400"/><line class="cl-pin" x1="820" y1="425" x2="805" y2="425"/><line class="cl-pin" x1="820" y1="450" x2="805" y2="450"/>
    <line class="cl-pin" x1="910" y1="400" x2="925" y2="400"/><line class="cl-pin" x1="910" y1="425" x2="925" y2="425"/><line class="cl-pin" x1="910" y1="450" x2="925" y2="450"/>
    <text x="865" y="432" fill="#e7c667" font-size="20" font-family="monospace" text-anchor="middle">MK</text>
  </g>
  <g>
    <circle class="cl-g" cx="480" cy="420" r="4"/><circle class="cl-p" cx="1000" cy="380" r="4"/>
    <circle class="cl-p" cx="560" cy="520" r="4"/><circle class="cl-g" cx="1040" cy="560" r="4"/>
    <circle class="cl-p" cx="120" cy="240" r="4"/><circle class="cl-p" cx="1200" cy="640" r="4"/>
  </g>
</svg>
