<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="cf-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1330"/><stop offset="55%" stop-color="#111d43"/><stop offset="100%" stop-color="#182450"/></linearGradient>
    <radialGradient id="cf-core" cx="0.5" cy="0.42" r="0.7"><stop offset="0" stop-color="#7fe9ff"/><stop offset="35%" stop-color="#3a54c9"/><stop offset="100%" stop-color="#16204a"/></radialGradient>
    <radialGradient id="cf-pool" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38bdf8" stop-opacity=".28"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="cf-poolG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e7c667" stop-opacity=".20"/><stop offset="100%" stop-color="#e7c667" stop-opacity="0"/></radialGradient>
    <radialGradient id="cf-vig" cx="0.62" cy="0.46" r="0.75"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#05070f" stop-opacity=".72"/></radialGradient>
    <linearGradient id="cf-left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#070b1c" stop-opacity=".78"/><stop offset="34%" stop-color="#070b1c" stop-opacity="0"/></linearGradient>
    <filter id="cf-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="cf-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="cf-bokeh" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="13"/></filter>
    <style>
      .cf-base{fill:none;stroke:#2a3d82;stroke-width:2;opacity:.55}
      .cf-flow{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:24 344;filter:url(#cf-glow);animation:cfFlow 3s linear infinite}
      .cf-cy{stroke:#5fd8ff}.cf-bl{stroke:#8fa2f7}.cf-gd{stroke:#f2d98a}
      @keyframes cfFlow{to{stroke-dashoffset:-368}}
      @keyframes cfPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
      @keyframes cfBreathe{0%,100%{opacity:.5}50%{opacity:.95}}
      @keyframes cfFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
      @keyframes cfTwinkle{0%,100%{opacity:.2}50%{opacity:.9}}
      .cf-corepulse{transform-origin:940px 452px;animation:cfPulse 2.8s ease-in-out infinite}
      .cf-poolan{animation:cfBreathe 6s ease-in-out infinite}
      .cf-bok{animation:cfFloat 13s ease-in-out infinite}
      .cf-tw{animation:cfTwinkle 4s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.cf-flow{stroke-dasharray:none;opacity:.6}}
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#cf-bg)"/>

  <!-- طبقة بعيدة: مسارات خافتة مموّهة -->
  <g filter="url(#cf-soft)" opacity=".5">
    <path class="cf-base" d="M120 180 H360 V300 H540"/>
    <path class="cf-base" d="M1320 140 H1120 V260 H980"/>
    <path class="cf-base" d="M160 760 H420 V640"/>
    <path class="cf-base" d="M1300 780 H1080 V660"/>
    <circle cx="360" cy="300" r="4" fill="#5f76d6"/><circle cx="1120" cy="260" r="4" fill="#5f76d6"/>
  </g>

  <!-- برك ضوء -->
  <g class="cf-poolan"><circle cx="960" cy="452" r="440" fill="url(#cf-pool)"/></g>
  <circle cx="1180" cy="700" r="300" fill="url(#cf-poolG)"/>

  <!-- المسارات الرئيسية + الخطوط المضيئة المتدفّقة (نقل بيانات) -->
  <defs>
    <path id="cf1" fill="none" d="M1030 402 H1230 V330 H1440"/>
    <path id="cf2" fill="none" d="M1030 452 H1440"/>
    <path id="cf3" fill="none" d="M1030 502 H1240 V600 H1440"/>
    <path id="cf4" fill="none" d="M902 362 V220 H820 V90"/>
    <path id="cf5" fill="none" d="M978 362 V240 H1080 V110"/>
    <path id="cf6" fill="none" d="M902 542 V690 H840 V860"/>
    <path id="cf7" fill="none" d="M978 542 V660 H1080 V840"/>
    <path id="cf8" fill="none" d="M1030 420 L1250 250 H1400"/>
    <path id="cf9" fill="none" d="M1030 520 L1260 690"/>
    <path id="cf10" fill="none" d="M850 430 H660 V330 H520"/>
    <path id="cf11" fill="none" d="M850 494 H700 V620"/>
  </defs>
  <g>
    <!-- الأساس الخافت -->
    <use href="#cf1" class="cf-base"/><use href="#cf2" class="cf-base"/><use href="#cf3" class="cf-base"/>
    <use href="#cf4" class="cf-base"/><use href="#cf5" class="cf-base"/><use href="#cf6" class="cf-base"/>
    <use href="#cf7" class="cf-base"/><use href="#cf8" class="cf-base"/><use href="#cf9" class="cf-base"/>
    <use href="#cf10" class="cf-base"/><use href="#cf11" class="cf-base"/>
    <!-- الخطوط المضيئة المتدفّقة -->
    <use href="#cf1" class="cf-flow cf-cy"/>
    <use href="#cf2" class="cf-flow cf-gd" style="animation-delay:.6s"/>
    <use href="#cf3" class="cf-flow cf-bl" style="animation-delay:1.1s"/>
    <use href="#cf4" class="cf-flow cf-cy" style="animation-delay:.3s"/>
    <use href="#cf5" class="cf-flow cf-gd" style="animation-delay:1.4s"/>
    <use href="#cf6" class="cf-flow cf-bl" style="animation-delay:.9s"/>
    <use href="#cf7" class="cf-flow cf-cy" style="animation-delay:1.7s"/>
    <use href="#cf8" class="cf-flow cf-gd" style="animation-delay:.5s"/>
    <use href="#cf9" class="cf-flow cf-cy" style="animation-delay:2s"/>
    <use href="#cf10" class="cf-flow cf-bl" style="animation-delay:1.2s"/>
    <use href="#cf11" class="cf-flow cf-cy" style="animation-delay:2.3s"/>
  </g>

  <!-- عُقد الأطراف -->
  <g fill="#8fa2f7" filter="url(#cf-glow)">
    <circle cx="1230" cy="330" r="4" class="cf-tw"/><circle cx="1240" cy="600" r="4" class="cf-tw" style="animation-delay:1s"/>
    <circle cx="820" cy="90" r="4" class="cf-tw" style="animation-delay:.5s"/><circle cx="1080" cy="110" r="4" class="cf-tw" style="animation-delay:1.5s"/>
    <circle cx="840" cy="860" r="4" class="cf-tw" style="animation-delay:.8s"/><circle cx="1080" cy="840" r="4" class="cf-tw" style="animation-delay:2s"/>
    <circle cx="660" cy="330" r="4" class="cf-tw" style="animation-delay:1.3s"/>
  </g>

  <!-- المعالج المركزي المتوهّج -->
  <g class="cf-corepulse" filter="url(#cf-glow)">
    <!-- الأطراف/الأرجل -->
    <g stroke="#f2d98a" stroke-width="2.4">
      <line x1="850" y1="392" x2="826" y2="392"/><line x1="850" y1="422" x2="826" y2="422"/><line x1="850" y1="452" x2="826" y2="452"/><line x1="850" y1="482" x2="826" y2="482"/><line x1="850" y1="512" x2="826" y2="512"/>
      <line x1="1030" y1="392" x2="1054" y2="392"/><line x1="1030" y1="422" x2="1054" y2="422"/><line x1="1030" y1="452" x2="1054" y2="452"/><line x1="1030" y1="482" x2="1054" y2="482"/><line x1="1030" y1="512" x2="1054" y2="512"/>
      <line x1="882" y1="362" x2="882" y2="338"/><line x1="912" y1="362" x2="912" y2="338"/><line x1="942" y1="362" x2="942" y2="338"/><line x1="972" y1="362" x2="972" y2="338"/><line x1="1002" y1="362" x2="1002" y2="338"/>
      <line x1="882" y1="542" x2="882" y2="566"/><line x1="912" y1="542" x2="912" y2="566"/><line x1="942" y1="542" x2="942" y2="566"/><line x1="972" y1="542" x2="972" y2="566"/><line x1="1002" y1="542" x2="1002" y2="566"/>
    </g>
    <rect x="850" y="362" width="180" height="180" rx="18" fill="url(#cf-core)" stroke="#7fe9ff" stroke-width="2"/>
    <rect x="878" y="390" width="124" height="124" rx="10" fill="none" stroke="#8fa2f7" stroke-width="1.3" opacity=".7"/>
    <!-- شبكة النواة -->
    <g stroke="#5fd8ff" stroke-width="1" opacity=".5">
      <line x1="909" y1="390" x2="909" y2="514"/><line x1="940" y1="390" x2="940" y2="514"/><line x1="971" y1="390" x2="971" y2="514"/>
      <line x1="878" y1="421" x2="1002" y2="421"/><line x1="878" y1="452" x2="1002" y2="452"/><line x1="878" y1="483" x2="1002" y2="483"/>
    </g>
    <circle cx="940" cy="452" r="20" fill="#bff0ff"/>
    <text x="940" y="461" fill="#0b1330" font-size="20" font-family="monospace" font-weight="bold" text-anchor="middle">MK</text>
  </g>

  <!-- مقدّمة bokeh (عمق ميداني) -->
  <g filter="url(#cf-bokeh)">
    <circle class="cf-bok" cx="360" cy="640" r="30" fill="#e7c667" opacity=".14"/>
    <circle class="cf-bok" cx="620" cy="760" r="22" fill="#5fd8ff" opacity=".12" style="animation-delay:3s"/>
    <circle class="cf-bok" cx="1240" cy="200" r="26" fill="#8fa2f7" opacity=".12" style="animation-delay:5s"/>
    <circle class="cf-bok" cx="200" cy="320" r="20" fill="#e7c667" opacity=".10" style="animation-delay:1.5s"/>
  </g>

  <!-- vignette + تعتيم اليسار -->
  <rect width="1440" height="900" fill="url(#cf-vig)"/>
  <rect width="1440" height="900" fill="url(#cf-left)"/>
</svg>
