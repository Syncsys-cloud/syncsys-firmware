<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="royalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  
  <!-- Cloud Icon with Sync Arrows -->
  <g transform="translate(10, 10) scale(0.9)">
    <!-- Cloud base -->
    <path d="M50 55 H24 A18 18 0 0 1 20 19 A24 24 0 0 1 64 15 A20 20 0 0 1 82 32 A16 16 0 0 1 76 55 Z" 
          fill="none" stroke="url(#cloudGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Sync arrows inside cloud -->
    <path d="M38 32 A12 12 0 0 1 58 26" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="56,22 62,26 56,30" fill="#ffffff"/>
    
    <path d="M62 38 A12 12 0 0 1 42 44" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="44,40 38,44 44,48" fill="#ffffff"/>
    
    <!-- Pulse network dots -->
    <circle cx="28" cy="48" r="2.5" fill="#00f2fe"/>
    <circle cx="72" cy="48" r="2.5" fill="#38ef7d"/>
  </g>

  <!-- Brand Typography -->
  <text x="96" y="44" font-family="'Segoe UI', 'Cairo', Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="0.5">
    Sync<tspan fill="url(#cloudGrad)">Sys</tspan>
  </text>
  <text x="210" y="44" font-family="'Segoe UI', 'Cairo', Arial, sans-serif" font-size="26" font-weight="400" fill="#00f2fe">
    .cloud
  </text>
  <text x="98" y="62" font-family="'Segoe UI', 'Cairo', Tahoma, sans-serif" font-size="11" font-weight="700" fill="#a0aec0" letter-spacing="3">
    ENTERPRISE OS
  </text>
</svg>