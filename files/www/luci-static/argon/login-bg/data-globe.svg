<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <!-- ===================== GRADIENTS ===================== -->
    <linearGradient id="dg-space" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0e1738"/>
      <stop offset="52%" stop-color="#0c1432"/>
      <stop offset="100%" stop-color="#0b1330"/>
    </linearGradient>
    <radialGradient id="dg-nebula" cx="0.68" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#1b2a6b" stop-opacity=".55"/>
      <stop offset="45%" stop-color="#152258" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#0b1330" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dg-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fa2f7" stop-opacity="0"/>
      <stop offset="72%" stop-color="#5f76d6" stop-opacity=".10"/>
      <stop offset="88%" stop-color="#8fa2f7" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#3a54c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dg-shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="55%" stop-color="#060a1f" stop-opacity="0"/>
      <stop offset="90%" stop-color="#060a1f" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#04061a" stop-opacity=".72"/>
    </radialGradient>
    <radialGradient id="dg-hi" cx="0.66" cy="0.30" r="0.55">
      <stop offset="0" stop-color="#aeb9fb" stop-opacity=".40"/>
      <stop offset="38%" stop-color="#5f76d6" stop-opacity=".12"/>
      <stop offset="70%" stop-color="#3a54c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dg-goldR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="45%" stop-color="#e7c667"/>
      <stop offset="100%" stop-color="#e7c667" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dg-cityR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#bfe0ff"/>
      <stop offset="100%" stop-color="#3a54c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dg-arcG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7c667" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f2d98a" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#e7c667" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dg-vleft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05081c" stop-opacity=".82"/>
      <stop offset="26%" stop-color="#070b22" stop-opacity=".45"/>
      <stop offset="52%" stop-color="#0b1330" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dg-vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#03050f" stop-opacity=".70"/>
    </radialGradient>

    <!-- ===================== FILTERS ===================== -->
    <filter id="dg-far" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="dg-back" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="dg-bokeh" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="dg-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="dg-bloom" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style><![CDATA[
      :root{}
      .dg-star{fill:#eaf0ff}
      .dg-star-g{fill:#f2d98a}
      .dg-tw{animation:dgTw 4.5s ease-in-out infinite}
      @keyframes dgTw{0%,100%{opacity:.18}50%{opacity:.9}}

      #dg-far{animation:dgDrift 46s ease-in-out infinite}
      @keyframes dgDrift{0%{transform:translate(0px,0px)}50%{transform:translate(-34px,16px)}100%{transform:translate(0px,0px)}}

      .dg-lat{fill:none;stroke:#3a54c9;stroke-width:1.1;opacity:.28}
      .dg-lat-f{fill:none;stroke:#6f86e6;stroke-width:1.25;opacity:.5}
      .dg-mer{fill:none;stroke:#5f76d6;stroke-width:1.25;animation:dgSweep 22s linear infinite}
      @keyframes dgSweep{
        0%{rx:8px;opacity:.10}
        17%{rx:150px;opacity:.48}
        33%{rx:255px;opacity:.80}
        50%{rx:300px;opacity:1}
        67%{rx:255px;opacity:.80}
        83%{rx:150px;opacity:.48}
        100%{rx:8px;opacity:.10}
      }

      #dg-rim{animation:dgHalo 7s ease-in-out infinite}
      @keyframes dgHalo{0%,100%{opacity:.55}50%{opacity:.9}}

      .dg-city{transform-box:fill-box;transform-origin:center;animation:dgCity 3.4s ease-in-out infinite}
      @keyframes dgCity{0%,100%{opacity:.65;transform:scale(.72)}50%{opacity:1;transform:scale(1.25)}}

      .dg-arcline{fill:none;stroke:url(#dg-arcG);stroke-width:1.6;opacity:.55}
      .dg-head{offset-rotate:0deg;animation:dgFly 6s linear infinite}
      @keyframes dgFly{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}

      .dg-bokeh{transform-box:fill-box;transform-origin:center;animation:dgFloat 18s ease-in-out infinite}
      @keyframes dgFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-26px)}}
      .dg-bokeh2{animation-duration:24s;animation-delay:-6s}
      .dg-bokeh3{animation-duration:21s;animation-delay:-11s}

      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    ]]></style>
  </defs>

  <!-- ===================== DEEP SPACE ===================== -->
  <rect width="1440" height="900" fill="url(#dg-space)"/>
  <rect width="1440" height="900" fill="url(#dg-nebula)"/>

  <!-- ===================== LAYER 1: FAR BLURRED STARFIELD ===================== -->
  <g id="dg-far" filter="url(#dg-far)" opacity=".7">
    <circle class="dg-star" cx="180" cy="140" r="2.4"/>
    <circle class="dg-star" cx="420" cy="90" r="1.8"/>
    <circle class="dg-star" cx="660" cy="200" r="2.6"/>
    <circle class="dg-star" cx="300" cy="360" r="2.0"/>
    <circle class="dg-star" cx="120" cy="520" r="2.8"/>
    <circle class="dg-star" cx="520" cy="620" r="2.2"/>
    <circle class="dg-star" cx="240" cy="760" r="2.0"/>
    <circle class="dg-star" cx="700" cy="820" r="2.6"/>
    <circle class="dg-star-g" cx="900" cy="130" r="2.2"/>
    <circle class="dg-star" cx="1180" cy="240" r="2.4"/>
    <circle class="dg-star" cx="1320" cy="120" r="1.9"/>
    <circle class="dg-star" cx="1260" cy="640" r="2.6"/>
    <circle class="dg-star" cx="1080" cy="780" r="2.2"/>
    <circle class="dg-star-g" cx="820" cy="700" r="1.8"/>
    <circle class="dg-star" cx="60" cy="300" r="2.0"/>
    <circle class="dg-star" cx="420" cy="470" r="1.7"/>
  </g>

  <!-- Nebular soft glow behind sphere -->
  <circle cx="980" cy="450" r="380" fill="url(#dg-nebula)" filter="url(#dg-bokeh)" opacity=".8"/>

  <!-- ===================== LAYER 1b: MID SHARP TWINKLING STARS ===================== -->
  <g>
    <circle class="dg-star dg-tw" cx="90" cy="180" r="1.3" style="animation-delay:-0.4s"/>
    <circle class="dg-star dg-tw" cx="220" cy="90" r="1.1" style="animation-delay:-1.9s"/>
    <circle class="dg-star dg-tw" cx="360" cy="230" r="1.4" style="animation-delay:-3.1s"/>
    <circle class="dg-star dg-tw" cx="150" cy="420" r="1.2" style="animation-delay:-0.9s"/>
    <circle class="dg-star dg-tw" cx="70" cy="640" r="1.3" style="animation-delay:-2.6s"/>
    <circle class="dg-star dg-tw" cx="300" cy="560" r="1.1" style="animation-delay:-4.0s"/>
    <circle class="dg-star dg-tw" cx="200" cy="720" r="1.4" style="animation-delay:-1.3s"/>
    <circle class="dg-star dg-tw" cx="440" cy="360" r="1.2" style="animation-delay:-3.7s"/>
    <circle class="dg-star dg-tw" cx="520" cy="150" r="1.1" style="animation-delay:-2.1s"/>
    <circle class="dg-star dg-tw" cx="470" cy="700" r="1.3" style="animation-delay:-0.6s"/>
    <circle class="dg-star dg-tw" cx="620" cy="470" r="1.2" style="animation-delay:-4.4s"/>
    <circle class="dg-star dg-tw" cx="640" cy="700" r="1.1" style="animation-delay:-1.7s"/>
    <circle class="dg-star-g dg-tw" cx="560" cy="300" r="1.4" style="animation-delay:-3.3s"/>
    <circle class="dg-star dg-tw" cx="1300" cy="360" r="1.3" style="animation-delay:-2.4s"/>
    <circle class="dg-star dg-tw" cx="1380" cy="560" r="1.1" style="animation-delay:-0.7s"/>
    <circle class="dg-star dg-tw" cx="1220" cy="820" r="1.4" style="animation-delay:-3.9s"/>
    <circle class="dg-star dg-tw" cx="1360" cy="760" r="1.2" style="animation-delay:-1.5s"/>
    <circle class="dg-star-g dg-tw" cx="1140" cy="120" r="1.3" style="animation-delay:-2.8s"/>
    <circle class="dg-star dg-tw" cx="1240" cy="180" r="1.1" style="animation-delay:-4.2s"/>
    <circle class="dg-star dg-tw" cx="760" cy="90" r="1.2" style="animation-delay:-0.3s"/>
  </g>

  <!-- ===================== LAYER 2: GLOBE ===================== -->
  <!-- Outer atmospheric halo / rim-light -->
  <g id="dg-rim">
    <circle cx="980" cy="450" r="352" fill="url(#dg-halo)" filter="url(#dg-soft)"/>
    <circle cx="980" cy="450" r="300" fill="none" stroke="#8fa2f7" stroke-width="1.6" opacity=".55"/>
    <circle cx="980" cy="450" r="303" fill="none" stroke="#3a54c9" stroke-width="6" opacity=".28" filter="url(#dg-soft)"/>
  </g>

  <!-- Back hemisphere wireframe (dim + blurred for depth) -->
  <g filter="url(#dg-back)" opacity=".4">
    <ellipse class="dg-lat" cx="980" cy="716.6" rx="77.7" ry="30.3"/>
    <ellipse class="dg-lat" cx="980" cy="645.2" rx="212.1" ry="82.7"/>
    <ellipse class="dg-lat" cx="980" cy="521.5" rx="289.8" ry="113"/>
    <ellipse class="dg-lat" cx="980" cy="378.5" rx="289.8" ry="113"/>
    <ellipse class="dg-lat" cx="980" cy="254.8" rx="212.1" ry="82.7"/>
    <ellipse class="dg-lat" cx="980" cy="183.4" rx="77.7" ry="30.3"/>
    <ellipse class="dg-mer" cx="980" cy="450" rx="90" ry="276" style="animation-delay:-11s"/>
    <ellipse class="dg-mer" cx="980" cy="450" rx="255" ry="276" style="animation-delay:-4s"/>
  </g>

  <!-- Sphere body shading (behind sharp front lines) -->
  <circle cx="980" cy="450" r="299" fill="#0c1636" opacity=".55"/>
  <circle cx="980" cy="450" r="299" fill="url(#dg-hi)"/>

  <!-- Front hemisphere latitudes (sharp) -->
  <g>
    <ellipse class="dg-lat-f" cx="980" cy="689" rx="150" ry="58.5"/>
    <ellipse class="dg-lat-f" cx="980" cy="588" rx="259.8" ry="101.3"/>
    <ellipse class="dg-lat-f" cx="980" cy="450" rx="300" ry="117"/>
    <ellipse class="dg-lat-f" cx="980" cy="312" rx="259.8" ry="101.3"/>
    <ellipse class="dg-lat-f" cx="980" cy="211" rx="150" ry="58.5"/>
  </g>

  <!-- Rotating meridians (sharp, animated rx sweep = rotation illusion) -->
  <g>
    <ellipse class="dg-mer" cx="980" cy="450" rx="8"   ry="276" style="animation-delay:0s"/>
    <ellipse class="dg-mer" cx="980" cy="450" rx="150" ry="276" style="animation-delay:-3.67s"/>
    <ellipse class="dg-mer" cx="980" cy="450" rx="255" ry="276" style="animation-delay:-7.33s"/>
    <ellipse class="dg-mer" cx="980" cy="450" rx="300" ry="276" style="animation-delay:-11s"/>
    <ellipse class="dg-mer" cx="980" cy="450" rx="255" ry="276" style="animation-delay:-14.67s"/>
    <ellipse class="dg-mer" cx="980" cy="450" rx="150" ry="276" style="animation-delay:-18.33s"/>
  </g>

  <!-- Pole caps -->
  <circle cx="980" cy="174" r="3.2" fill="#8fa2f7" opacity=".8"/>
  <circle cx="980" cy="726" r="3.0" fill="#5f76d6" opacity=".6"/>

  <!-- Terminator / edge darkening over the whole sphere -->
  <circle cx="980" cy="450" r="300" fill="url(#dg-shade)"/>

  <!-- ===================== DATA ARCS (fly between cities) ===================== -->
  <g>
    <path class="dg-arcline" d="M902,360 Q1030,318 1120,470"/>
    <path class="dg-arcline" d="M1052,330 Q900,300 862,500"/>
    <path class="dg-arcline" d="M992,562 Q1132,520 1082,410"/>
    <path class="dg-arcline" d="M1002,300 Q878,360 942,468"/>
    <path class="dg-arcline" d="M862,500 Q970,286 1082,410"/>

    <circle class="dg-head" r="3.4" fill="url(#dg-goldR)" filter="url(#dg-bloom)" style="offset-path:path('M902,360 Q1030,318 1120,470');animation-duration:6.2s;animation-delay:-0.5s"/>
    <circle class="dg-head" r="3.4" fill="url(#dg-goldR)" filter="url(#dg-bloom)" style="offset-path:path('M1052,330 Q900,300 862,500');animation-duration:7.4s;animation-delay:-3.1s"/>
    <circle class="dg-head" r="3.4" fill="url(#dg-goldR)" filter="url(#dg-bloom)" style="offset-path:path('M992,562 Q1132,520 1082,410');animation-duration:5.6s;animation-delay:-2.2s"/>
    <circle class="dg-head" r="3.4" fill="url(#dg-goldR)" filter="url(#dg-bloom)" style="offset-path:path('M1002,300 Q878,360 942,468');animation-duration:6.8s;animation-delay:-4.6s"/>
    <circle class="dg-head" r="3.6" fill="url(#dg-goldR)" filter="url(#dg-bloom)" style="offset-path:path('M862,500 Q970,286 1082,410');animation-duration:8.2s;animation-delay:-1.3s"/>
  </g>

  <!-- ===================== CITY NODES (glowing) ===================== -->
  <g filter="url(#dg-bloom)">
    <circle class="dg-city" cx="902"  cy="360" r="4.2" fill="url(#dg-cityR)" style="animation-delay:-0.2s"/>
    <circle class="dg-city" cx="1052" cy="330" r="4.6" fill="url(#dg-cityR)" style="animation-delay:-1.4s"/>
    <circle class="dg-city" cx="1120" cy="470" r="4.0" fill="url(#dg-cityR)" style="animation-delay:-2.7s"/>
    <circle class="dg-city" cx="862"  cy="500" r="4.4" fill="url(#dg-cityR)" style="animation-delay:-0.9s"/>
    <circle class="dg-city" cx="992"  cy="562" r="4.2" fill="url(#dg-cityR)" style="animation-delay:-3.3s"/>
    <circle class="dg-city" cx="1002" cy="300" r="3.8" fill="url(#dg-cityR)" style="animation-delay:-1.9s"/>
    <circle class="dg-city" cx="942"  cy="468" r="4.6" fill="url(#dg-goldR)" style="animation-delay:-2.3s"/>
    <circle class="dg-city" cx="1082" cy="410" r="4.2" fill="url(#dg-goldR)" style="animation-delay:-0.6s"/>
  </g>

  <!-- ===================== LAYER 3: FOREGROUND GOLD BOKEH ===================== -->
  <g>
    <circle class="dg-bokeh"  cx="1180" cy="700" r="46" fill="url(#dg-goldR)" filter="url(#dg-bokeh)" opacity=".22"/>
    <circle class="dg-bokeh dg-bokeh2" cx="700" cy="240" r="34" fill="url(#dg-goldR)" filter="url(#dg-bokeh)" opacity=".16"/>
    <circle class="dg-bokeh dg-bokeh3" cx="1320" cy="380" r="28" fill="url(#dg-goldR)" filter="url(#dg-bokeh)" opacity=".18"/>
    <circle class="dg-bokeh"  cx="560" cy="820" r="40" fill="url(#dg-goldR)" filter="url(#dg-bokeh)" opacity=".14" style="animation-delay:-9s"/>
  </g>

  <!-- ===================== VIGNETTE (left card zone darker) ===================== -->
  <rect width="1440" height="900" fill="url(#dg-vig)"/>
  <rect width="820" height="900" fill="url(#dg-vleft)"/>
</svg>
