<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="wn-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#243a86"/><stop offset="55%" stop-color="#172a63"/><stop offset="100%" stop-color="#0e1738"/></linearGradient>
    <radialGradient id="wn-g" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e7c667" stop-opacity=".22"/><stop offset="100%" stop-color="#e7c667" stop-opacity="0"/></radialGradient>
    <style>
      .wn-w{fill:none;stroke-linecap:round;opacity:0}
      @keyframes wnP{0%{opacity:0;transform:scale(.55)}30%{opacity:.85}100%{opacity:0;transform:scale(1.4)}}
      @keyframes wnMove{0%{transform:translateX(0)}100%{transform:translateX(-140px)}}
      .wn-a{transform-origin:center;animation:wnP 3.4s ease-out infinite}
      .wn-wave{animation:wnMove 24s linear infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.wn-w{opacity:.5}}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#wn-bg)"/>
  <circle cx="1080" cy="620" r="360" fill="url(#wn-g)"/>
  <g class="wn-wave" opacity=".5">
    <path d="M-160 660 Q 60 620 260 660 T 660 660 T 1060 660 T 1460 660 T 1860 660 V 900 H -160 Z" fill="#3a54c9" opacity=".10"/>
    <path d="M-160 720 Q 80 686 280 720 T 680 720 T 1080 720 T 1480 720 T 1880 720 V 900 H -160 Z" fill="#e7c667" opacity=".06"/>
  </g>
  <!-- برج بثّ + موجات -->
  <g transform="translate(1080,600)">
    <rect x="-8" y="-10" width="16" height="120" rx="4" fill="#2b3f8f" stroke="#e7c667" stroke-width="1.4"/>
    <circle cx="0" cy="-14" r="6" fill="#e7c667"/>
    <g transform="translate(0,-14)">
      <path class="wn-w wn-a" d="M-30 0 A30 30 0 0 1 30 0" stroke="#e7c667" stroke-width="3"/>
      <path class="wn-w wn-a" style="animation-delay:.6s" d="M-52 -8 A52 52 0 0 1 52 -8" stroke="#8fa2f7" stroke-width="3"/>
      <path class="wn-w wn-a" style="animation-delay:1.2s" d="M-74 -18 A74 74 0 0 1 74 -18" stroke="#8fa2f7" stroke-width="2.5"/>
    </g>
  </g>
  <g fill="#8fa2f7">
    <circle cx="300" cy="240" r="4"/><circle cx="560" cy="180" r="3"/><circle cx="760" cy="300" r="4"/><circle cx="220" cy="440" r="3"/>
  </g>
</svg>
