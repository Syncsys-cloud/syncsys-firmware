name: Build SyncSys.cloud Firmware

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Select Target Router Device'
        required: true
        default: 'xiaomi_miwifi_mini'
        type: choice
        options:
          - 'xiaomi_miwifi_mini'
          - 'xiaomi_cr6609'
          - 'qihoo_360t6gs'
          - 'all'
      ssh:
        description: 'SSH connection to Actions for debugging (true/false)'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Riyadh

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        device: ${{ github.event.inputs.target_device == 'all' && fromJSON('["xiaomi_miwifi_mini", "xiaomi_cr6609", "qihoo_360t6gs"]') || fromJSON(format('["{0}"]', github.event.inputs.target_device)) }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone ImmortalWrt Source Code
      working-directory: /workdir
      run: |
        df -h
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load Custom Feeds (DIY Part 1)
      run: |
        [ -e $DIY_P1_SH ] && chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Device Configuration & Apply Branding (DIY Part 2)
      run: |
        cd openwrt
        if [ "${{ matrix.device }}" = "xiaomi_miwifi_mini" ]; then
            cp -f $GITHUB_WORKSPACE/config/miwifi_mini.config .config
        elif [ "${{ matrix.device }}" = "xiaomi_cr6609" ]; then
            cp -f $GITHUB_WORKSPACE/config/cr6609.config .config
        else
            cp -f $GITHUB_WORKSPACE/config/360t6gs.config .config
        fi
        [ -e $GITHUB_WORKSPACE/$DIY_P2_SH ] && chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
        $GITHUB_WORKSPACE/$DIY_P2_SH
        make defconfig

    - name: Download Compilation Packages
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the Firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize Firmware Output
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware to GitHub Actions Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: SyncSys-cloud-${{ matrix.device }}-Firmware
        path: ${{ env.FIRMWARE }}/*

    - name: Generate Release Tag & Hash
      id: tag
      if: steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=SyncSys-${{ matrix.device }}-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
        cd ${{ env.FIRMWARE }}
        sha256sum * > sha256sums.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware to GitHub Release
      uses: softprops/action-gh-release@v2
      continue-on-error: true
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body: |
          # 🚀 SyncSys.cloud OS v1.0 LTS Release
          Automated compilation for **${{ matrix.device }}**.
          
          ### Device Highlights:
          - Target Profile: `${{ matrix.device }}`
          - Operating System: `SyncSys.cloud OS (ImmortalWrt / Linux 6.6)`
          - Default Gateway: `192.168.1.1`
          - Included Suites: Multi-WAN, WireGuard, SQM, Wi-Fi Repeater / Extender, Argon Dark Theme, 100% Arabic UI
        files: |
          ${{ env.FIRMWARE }}/*
